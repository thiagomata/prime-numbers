<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#222" />
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="300" fill="white" />
  <line x1="100" y1="70" x2="560" y2="70" stroke="#222" stroke-width="3" />
  <line x1="100" y1="60" x2="100" y2="80" stroke="#222" stroke-width="2" />
  <text x="100" y="50" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#111" text-anchor="middle">p</text>
  <line x1="560" y1="60" x2="560" y2="80" stroke="#222" stroke-width="2" />
  <text x="560" y="50" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#111" text-anchor="middle">p^2</text>
  <text x="330.0" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#111" text-anchor="middle">certified window</text>
  <line x1="200" y1="160" x2="320" y2="160" stroke="#222" stroke-width="2" />
  <circle cx="200" cy="160" r="7" fill="#27ae60" stroke="#27ae60" stroke-width="2" />
  <circle cx="320" cy="160" r="7" fill="#27ae60" stroke="#27ae60" stroke-width="2" />
  <text x="260.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#111" text-anchor="middle">2</text>
  <text x="200" y="186" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#111" text-anchor="middle">x<tspan font-size="10" dy="5"></tspan></text>
  <text x="320" y="186" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#111" text-anchor="middle">x+2</text>
  <text x="260.0" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1e8449" text-anchor="middle">certifies a twin-prime pair</text>
  <line x1="470" y1="250" x2="590" y2="250" stroke="#222" stroke-width="2" />
  <circle cx="470" cy="250" r="7" fill="white" stroke="#e67e22" stroke-width="2" />
  <circle cx="590" cy="250" r="7" fill="white" stroke="#e67e22" stroke-width="2" />
  <text x="530.0" y="236" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#111" text-anchor="middle">2</text>
  <text x="470" y="276" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#111" text-anchor="middle">y</text>
  <text x="590" y="276" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#111" text-anchor="middle">y+2</text>
  <text x="530.0" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#af601a" text-anchor="middle">survives filters, not yet certified</text>

  <text x="550" y="116" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#111" text-anchor="middle">e<tspan font-size="10" dy="5">i+2</tspan></text>
  <text x="205" y="76" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#111" text-anchor="middle">g<tspan font-size="10" dy="5">i</tspan></text>
  <text x="435" y="76" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#111" text-anchor="middle">g<tspan font-size="10" dy="5">i+1</tspan></text>
  <text x="320" y="160" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#111" text-anchor="middle">After filtering</text>
  <line x1="90" y1="220" x2="550" y2="220" stroke="#222" stroke-width="2" />

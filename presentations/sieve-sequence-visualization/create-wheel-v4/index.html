<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filter a Wheel's Trace</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #d9c8a5;
        color: #202521;
      }
      * { box-sizing: border-box; }
      html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #scene { display: block; width: 100%; height: 100%; }
      .step-copy {
        position: fixed;
        z-index: 2;
        top: 20px;
        left: 24px;
        max-width: min(500px, calc(100% - 48px));
        color: #202521;
        text-shadow: 0 1px 14px #f6efdfee;
        pointer-events: none;
      }
      .step-copy h1 { margin: 0; font-size: 22px; font-weight: 600; }
      .step-copy p { margin: 5px 0 0; max-width: 460px; color: #414940; font-size: 14px; line-height: 1.4; }
      .controls {
        position: fixed;
        z-index: 3;
        right: 20px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        background: rgba(250, 247, 237, 0.92);
        color: #26312e;
      }
      .controls button {
        min-width: 82px;
        min-height: 40px;
        border: 1px solid #52645c;
        background: #f8f5eb;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .controls button:disabled { opacity: 0.42; cursor: default; }
      #step-count { min-width: 42px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
      @media (max-width: 520px) {
        .step-copy { top: 14px; left: 14px; max-width: calc(100% - 28px); }
        .step-copy h1 { font-size: 19px; }
        .step-copy p { font-size: 13px; }
        .controls { right: 12px; bottom: 12px; }
      }
    </style>
    <script type="importmap">
      {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}
    </script>
  </head>
  <body>
    <main>
      <canvas id="scene" aria-label="A [2,4] wheel lays five copies of its trace, removes multiples of 5, then bends into a larger wheel"></canvas>
      <header class="step-copy" aria-live="polite">
        <h1 id="step-title">[2,4] · Current wheel</h1>
        <p id="step-description">Four pins repeat the same 2, 4 gap pattern around the 12-position wheel.</p>
      </header>
      <nav class="controls" aria-label="Construction steps">
        <button id="previous" type="button" disabled>Previous</button>
        <span id="step-count" aria-live="polite">1 / 5</span>
        <button id="next" type="button">Next</button>
      </nav>
    </main>
    <script type="module">
      import * as THREE from "three";

      const canvas = document.querySelector("#scene");
      const shell = document.querySelector("main");
      const title = document.querySelector("#step-title");
      const description = document.querySelector("#step-description");
      const previousButton = document.querySelector("#previous");
      const nextButton = document.querySelector("#next");
      const stepCount = document.querySelector("#step-count");
      const TAU = Math.PI * 2;
      const START_VALUE = 7;
      const BASE_POSITIONS = 12;
      const BASE_RADIUS = 0.78;
      const UNIT_DISTANCE = TAU * BASE_RADIUS / BASE_POSITIONS;
      const HEAD = 5;
      const REPEAT_FACTOR = HEAD;
      const EXPANDED_POSITIONS = BASE_POSITIONS * REPEAT_FACTOR;
      const EXPANDED_RADIUS = BASE_RADIUS * REPEAT_FACTOR;
      const TRACE_LENGTH = EXPANDED_POSITIONS * UNIT_DISTANCE;
      const TRACE_DURATION = 10;
      const FILTER_DURATION = 8;
      const SPEED = 0.7;
      const SURFACE_Y = -0.055;
      const CLEARANCE = 0.006;
      const MAX_FOOTPRINTS = 32;
      const LANES = { first: 2.5, repeated: -1.5, next: 2.5 };
      const RULER_LANES = { first: 4.5, repeated: 0.5, next: 4.5 };
      const COLORS = { wheel: 0x6fae9e, filter: 0xc65350, next: 0xd1a24a };
      const STEPS = [
        { title: "[2,4] · Current wheel", description: "Four pins repeat the same 2, 4 gap pattern around the 12-position wheel." },
        { title: "Repeat the trace", description: "Five copies of the small wheel's marks form one continuous strip." },
        { title: "Remove multiples of 5", description: "The pins at 25, 35, 55, and 65 are removed from the numbered strip." },
        { title: "Bend the filtered strip", description: "The full 60-position length closes into a larger wheel, with four empty pin positions." },
        { title: "Next wheel", description: "The enlarged wheel keeps the surviving pins and continues to roll." },
      ];

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd9c8a5);
      let viewHeight = 5.5;
      const camera = new THREE.OrthographicCamera(-viewHeight / 2, viewHeight / 2, viewHeight / 2, -viewHeight / 2, 0.1, 120);
      camera.position.set(0, 8, 16);
      camera.lookAt(0, 0.8, 0);
      scene.add(new THREE.HemisphereLight(0xfff9e8, 0x756749, 2.3));
      const sun = new THREE.DirectionalLight(0xfff4d8, 4.2);
      sun.position.set(-7, 14, 9);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -18;
      sun.shadow.camera.right = 18;
      sun.shadow.camera.top = 14;
      sun.shadow.camera.bottom = -8;
      scene.add(sun);

      function createSandTexture() {
        const textureCanvas = document.createElement("canvas");
        textureCanvas.width = 512;
        textureCanvas.height = 512;
        const context = textureCanvas.getContext("2d");
        context.fillStyle = "#cdb98f";
        context.fillRect(0, 0, 512, 512);
        let seed = 4173;
        const random = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        for (let index = 0; index < 7200; index += 1) {
          const light = random() > 0.52;
          const alpha = 0.04 + random() * 0.1;
          context.fillStyle = light ? `rgba(255,246,215,${alpha})` : `rgba(91,72,43,${alpha})`;
          context.beginPath();
          context.arc(random() * 512, random() * 512, 0.35 + random() * 1.15, 0, TAU);
          context.fill();
        }
        const texture = new THREE.CanvasTexture(textureCanvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(10, 10);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      }

      const sandTexture = createSandTexture();
      const sand = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshStandardMaterial({ map: sandTexture, color: 0xd1bd94, roughness: 1 }),
      );
      sand.rotation.x = -Math.PI / 2;
      sand.position.y = SURFACE_Y;
      sand.receiveShadow = true;
      scene.add(sand);

      const rulerMaterial = new THREE.MeshStandardMaterial({ color: 0xd7d4c7, roughness: 0.55 });
      const rulerLanes = [...new Set(Object.values(RULER_LANES))].map((lane) => {
        const ruler = new THREE.Mesh(new THREE.BoxGeometry(80, 0.065, 0.34), rulerMaterial);
        ruler.position.set(0, -0.005, lane);
        ruler.receiveShadow = true;
        scene.add(ruler);
        return { lane, ruler };
      });

      const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x34403c, metalness: 0.18, roughness: 0.48 });
      const footprints = [];
      const wheels = [];
      const state = { distance: 0, stage: 0, traceProgress: 0, traceRevealProgress: 0, alignmentProgress: 0, alignmentStart: 0, alignedAngle: 0, bendProgress: 0, filterIntroProgress: 0, filterProgress: 0, previousTime: 0, cameraX: 0, cameraY: 0.8, cameraHeight: 5.5 };

      function isCandidatePosition(localPosition) {
        const cyclePosition = localPosition % BASE_POSITIONS;
        return cyclePosition === 0 || cyclePosition === 4 || cyclePosition === 6 || cyclePosition === 10;
      }

      function isActive(wheel, localPosition) {
        if (localPosition < 0 || !isCandidatePosition(localPosition)) return false;
        if (wheel.kind === "repeated" && state.stage >= 2) return (wheel.startValue + localPosition) % HEAD !== 0;
        if (wheel.kind === "next") return (wheel.startValue + localPosition) % HEAD !== 0;
        return true;
      }

      function createWheel({ kind, positions, radius, startValue, lane, color }) {
        const startPosition = startValue - START_VALUE;
        const rootRadius = Math.max(radius - 0.16, radius * 0.82);
        const thickness = positions > BASE_POSITIONS ? 0.42 : 0.34;
        const carrier = new THREE.Group();
        carrier.position.set(startPosition * UNIT_DISTANCE, radius + SURFACE_Y + CLEARANCE, lane);
        scene.add(carrier);
        const rolling = new THREE.Group();
        carrier.add(rolling);

        const body = new THREE.Mesh(new THREE.CylinderGeometry(rootRadius, rootRadius, thickness, positions), bodyMaterial);
        body.rotation.x = Math.PI / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        rolling.add(body);

        const pinLength = radius - rootRadius + 0.05;
        const slotWidth = Math.min(0.2, UNIT_DISTANCE * 0.42);
        const pins = [];
        const candidatePins = [];
        for (let position = 0; position < positions; position += 1) {
          const value = startValue + position;
          const candidate = isCandidatePosition(position);
          const bad = kind === "repeated" && candidate && value % HEAD === 0;
          const angle = -Math.PI / 2 + position / positions * TAU;
          const length = pinLength;
          const material = new THREE.MeshStandardMaterial({
            color: bad ? COLORS.filter : color,
            roughness: 0.42,
          });
          const pin = new THREE.Mesh(new THREE.BoxGeometry(slotWidth, length, thickness * 1.08), material);
          const pinCenter = radius - length / 2;
          pin.position.set(Math.cos(angle) * pinCenter, Math.sin(angle) * pinCenter, 0);
          pin.rotation.z = angle - Math.PI / 2;
          pin.castShadow = true;
          pin.visible = candidate && (kind !== "next" || value % HEAD !== 0);
          pin.userData.filterHit = bad;
          rolling.add(pin);
          if (candidate) candidatePins.push(pin);
          if (bad) pins.push(pin);
        }

        const hubRadius = Math.max(0.12, Math.min(rootRadius * 0.22, 0.42));
        const hub = new THREE.Mesh(
          new THREE.CylinderGeometry(hubRadius, hubRadius, thickness * 1.2, 32),
          new THREE.MeshStandardMaterial({ color, roughness: 0.4 }),
        );
        hub.rotation.x = Math.PI / 2;
        hub.castShadow = true;
        rolling.add(hub);

        const glow = new THREE.Mesh(
          new THREE.RingGeometry(0.055, 0.13, 28),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }),
        );
        glow.rotation.x = -Math.PI / 2;
        glow.position.set(startPosition * UNIT_DISTANCE, SURFACE_Y + CLEARANCE + 0.004, lane);
        scene.add(glow);
        const wheel = { kind, positions, radius, startValue, startPosition, lane, rulerLane: RULER_LANES[kind], color, carrier, rolling, body, hub, pins, candidatePins, glow, lastChecked: -1, impact: 0, footprints: [] };
        wheels.push(wheel);
        return wheel;
      }

      const firstWheel = createWheel({ kind: "first", positions: BASE_POSITIONS, radius: BASE_RADIUS, startValue: 7, lane: LANES.first, color: COLORS.wheel });
      const repeatedWheel = createWheel({ kind: "repeated", positions: EXPANDED_POSITIONS, radius: EXPANDED_RADIUS, startValue: 7, lane: LANES.repeated, color: COLORS.wheel });
      const nextWheel = repeatedWheel;

      // Arc length s is shared by the flat strip and the closed rim.
      function tracePoint(s, bend) {
        const angle = bend * s / EXPANDED_RADIUS;
        const bendingRadius = bend < 0.0001 ? 0 : EXPANDED_RADIUS / bend;
        const x = bend < 0.0001 ? s : Math.sin(angle) * bendingRadius;
        const y = SURFACE_Y + CLEARANCE + (bend < 0.0001 ? 0 : (1 - Math.cos(angle)) * bendingRadius);
        const phase = -(state.distance * UNIT_DISTANCE / EXPANDED_RADIUS) * bend * bend * bend;
        const centerY = SURFACE_Y + CLEARANCE + EXPANDED_RADIUS;
        return {
          x: x * Math.cos(phase) - (y - centerY) * Math.sin(phase),
          y: centerY + x * Math.sin(phase) + (y - centerY) * Math.cos(phase),
          angle: angle + phase,
        };
      }

      const stripSegments = EXPANDED_POSITIONS * 3;
      const stripPositions = new Float32Array((stripSegments + 1) * 6);
      const stripIndices = [];
      for (let segment = 0; segment < stripSegments; segment += 1) {
        const vertex = segment * 2;
        stripIndices.push(vertex, vertex + 1, vertex + 2, vertex + 1, vertex + 3, vertex + 2);
      }
      const stripGeometry = new THREE.BufferGeometry();
      stripGeometry.setAttribute("position", new THREE.BufferAttribute(stripPositions, 3).setUsage(THREE.DynamicDrawUsage));
      stripGeometry.setIndex(stripIndices);
      const strip = new THREE.Mesh(
        stripGeometry,
        new THREE.MeshStandardMaterial({ color: 0x34403c, roughness: 0.5, metalness: 0.15, side: THREE.DoubleSide }),
      );
      strip.castShadow = true;
      strip.receiveShadow = true;
      scene.add(strip);

      const constructionPinLength = EXPANDED_RADIUS - Math.max(EXPANDED_RADIUS - 0.16, EXPANDED_RADIUS * 0.82) + 0.05;
      const constructionPinGeometry = new THREE.BoxGeometry(Math.min(0.2, UNIT_DISTANCE * 0.42), constructionPinLength, 0.42 * 1.08);
      const constructionPinMaterial = new THREE.MeshStandardMaterial({ color: COLORS.wheel, roughness: 0.42 });
      const sourcePinColor = new THREE.Color(COLORS.wheel);
      const nextPinColor = new THREE.Color(COLORS.next);
      const constructionPins = [];
      const constructionLabels = [];
      const badPinPositions = [];
      for (let position = 0; position < EXPANDED_POSITIONS; position += 1) {
        if (!isCandidatePosition(position)) continue;
        const pin = new THREE.Mesh(constructionPinGeometry, constructionPinMaterial.clone());
        pin.castShadow = true;
        pin.userData.tracePosition = position;
        const value = START_VALUE + position;
        pin.userData.filterHit = Math.floor(value / HEAD) * HEAD === value;
        pin.userData.filterRank = pin.userData.filterHit ? badPinPositions.length : -1;
        if (pin.userData.filterHit) badPinPositions.push(position);
        scene.add(pin);
        constructionPins.push(pin);
      }

      const seamGeometry = new THREE.BoxGeometry(0.025, 0.17, 0.48);
      const seamMaterial = new THREE.MeshStandardMaterial({ color: 0xdacdad, roughness: 0.75 });
      const constructionSeams = [];
      for (let copy = 1; copy < REPEAT_FACTOR; copy += 1) {
        const seam = new THREE.Mesh(seamGeometry, seamMaterial);
        seam.userData.traceDistance = (copy * BASE_POSITIONS - 0.5) * UNIT_DISTANCE;
        scene.add(seam);
        constructionSeams.push(seam);
      }

      const contactLink = new THREE.Mesh(
        new THREE.BoxGeometry(0.055, 0.025, Math.abs(LANES.first - LANES.repeated)),
        new THREE.MeshBasicMaterial({ color: 0x348c77, transparent: true, opacity: 0, depthWrite: false }),
      );
      contactLink.position.set(0, SURFACE_Y + CLEARANCE + 0.03, (LANES.first + LANES.repeated) / 2);
      scene.add(contactLink);

      function removalAmount(rank) {
        if (state.stage < 2) return 0;
        if (state.stage > 2) return 1;
        return THREE.MathUtils.clamp((state.filterProgress * badPinPositions.length - rank - 0.25) / 0.6, 0, 1);
      }

      function updateConstruction() {
        const constructing = state.stage >= 1 && state.stage <= 3;
        const bend = state.stage === 3 ? state.bendProgress : 0;
        const visibleLength = state.traceProgress * TRACE_LENGTH;
        const recolor = state.stage > 2 ? 1
          : state.stage === 2 ? THREE.MathUtils.clamp((state.filterProgress - 0.88) / 0.12, 0, 1) : 0;
        strip.visible = constructing && state.traceProgress > 0.001 && bend < 1;
        if (strip.visible) {
          for (let sample = 0; sample <= stripSegments; sample += 1) {
            const point = tracePoint(Math.min(sample / stripSegments * TRACE_LENGTH, visibleLength), bend);
            const normalX = Math.sin(point.angle);
            const normalY = -Math.cos(point.angle);
            const offset = sample * 6;
            stripPositions[offset] = point.x - normalX * 0.1;
            stripPositions[offset + 1] = point.y - normalY * 0.1;
            stripPositions[offset + 2] = LANES.repeated;
            stripPositions[offset + 3] = point.x - normalX * 0.26;
            stripPositions[offset + 4] = point.y - normalY * 0.26;
            stripPositions[offset + 5] = LANES.repeated;
          }
          stripGeometry.attributes.position.needsUpdate = true;
          stripGeometry.computeVertexNormals();
          stripGeometry.computeBoundingSphere();
        }
        constructionPins.forEach((pin) => {
          const distance = pin.userData.tracePosition * UNIT_DISTANCE;
          const removed = pin.userData.filterHit ? removalAmount(pin.userData.filterRank) : 0;
          pin.visible = constructing && bend < 1 && distance < visibleLength && removed < 1;
          pin.scale.y = 1 - removed;
          if (pin.userData.filterHit) {
            const marked = state.stage >= 2 && state.filterProgress * badPinPositions.length >= pin.userData.filterRank;
            pin.material.color.setHex(marked ? COLORS.filter : COLORS.wheel);
          } else {
            pin.material.color.copy(sourcePinColor).lerp(nextPinColor, recolor);
          }
          if (!pin.visible) return;
          const point = tracePoint(distance, bend);
          const normalX = Math.sin(point.angle);
          const normalY = -Math.cos(point.angle);
          pin.position.set(
            point.x - normalX * constructionPinLength / 2,
            point.y - normalY * constructionPinLength / 2,
            LANES.repeated,
          );
          pin.rotation.z = Math.PI + point.angle;
        });
        const labelHeight = 20 * viewHeight / Math.max(shell.clientHeight, 1) * (80 / 44);
        constructionLabels.forEach((label) => {
          const distance = label.userData.tracePosition * UNIT_DISTANCE;
          label.visible = (state.stage === 1 || state.stage === 2) && distance < visibleLength;
          if (!label.visible) return;
          if (label.userData.filterHit) {
            const marked = state.stage === 2 && state.filterProgress * badPinPositions.length >= label.userData.filterRank;
            const map = marked ? label.userData.redMap : label.userData.defaultMap;
            if (label.material.map !== map) {
              label.material.map = map;
              label.material.needsUpdate = true;
            }
            label.material.opacity = 1 - 0.35 * removalAmount(label.userData.filterRank);
          }
          const stagger = label.userData.raised ? 23 * viewHeight / Math.max(shell.clientHeight, 1) : 0;
          label.position.set(distance, SURFACE_Y + CLEARANCE + 0.45 + labelHeight * 0.5 + stagger, LANES.repeated);
          label.scale.set(labelHeight * 128 / 80, labelHeight, 1);
        });
        constructionSeams.forEach((seam) => {
          const distance = seam.userData.traceDistance;
          seam.visible = constructing && bend < 1 && distance < visibleLength;
          if (!seam.visible) return;
          const point = tracePoint(distance, bend);
          const normalX = Math.sin(point.angle);
          const normalY = -Math.cos(point.angle);
          seam.position.set(point.x - normalX * 0.18, point.y - normalY * 0.18, LANES.repeated);
          seam.rotation.z = Math.PI + point.angle;
        });
      }

      const markerPool = [];
      function makeLabelTexture(value, color = "#26312e") {
        const labelCanvas = document.createElement("canvas");
        labelCanvas.width = 128;
        labelCanvas.height = 80;
        const context = labelCanvas.getContext("2d");
        context.fillStyle = color;
        context.font = "600 44px system-ui, sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(String(value), 64, 40);
        const texture = new THREE.CanvasTexture(labelCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      constructionPins.forEach((pin) => {
        const value = START_VALUE + pin.userData.tracePosition;
        const defaultMap = makeLabelTexture(value);
        const label = new THREE.Sprite(new THREE.SpriteMaterial({
          map: defaultMap,
          transparent: true,
          depthWrite: false,
          depthTest: false,
        }));
        label.userData.tracePosition = pin.userData.tracePosition;
        label.userData.raised = isCandidatePosition(pin.userData.tracePosition - 2);
        label.userData.filterHit = pin.userData.filterHit;
        label.userData.filterRank = pin.userData.filterRank;
        label.userData.defaultMap = defaultMap;
        if (pin.userData.filterHit) label.userData.redMap = makeLabelTexture(value, "#b63131");
        scene.add(label);
        constructionLabels.push(label);
      });

      for (let index = 0; index < 121; index += 1) {
        const group = new THREE.Group();
        const ticks = [];
        const labels = [];
        for (const track of [
          { kind: "first", wheelLane: LANES.first, rulerLane: RULER_LANES.first },
          { kind: "repeated", wheelLane: LANES.repeated, rulerLane: RULER_LANES.repeated },
        ]) {
          const tick = new THREE.Mesh(
            new THREE.BoxGeometry(0.025, 0.045, 0.5),
            new THREE.MeshStandardMaterial({ color: 0x353b37, roughness: 0.65 }),
          );
          tick.position.set(0, 0.028, track.rulerLane - 0.16);
          group.add(tick);
          const guide = new THREE.Mesh(
            new THREE.BoxGeometry(0.022, 0.014, Math.abs(track.rulerLane - track.wheelLane)),
            new THREE.MeshStandardMaterial({ color: 0x9f8961, roughness: 1 }),
          );
          guide.position.set(0, -0.025, (track.rulerLane + track.wheelLane) / 2);
          group.add(guide);
          ticks.push({ rulerLane: track.rulerLane, mesh: tick, guide });
          const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeLabelTexture(1), transparent: true, depthWrite: false }));
          label.scale.set(0.48, 0.3, 1);
          label.position.set(0, 0.18, track.rulerLane + 0.28);
          group.add(label);
          labels.push(label);
        }
        group.userData = { ticks, labels, value: 1 };
        scene.add(group);
        markerPool.push(group);
      }

      const footprintGeometry = new THREE.CylinderGeometry(0.085, 0.11, 0.035, 28);
      const footprintMaterial = new THREE.MeshStandardMaterial({ color: 0x6f5b38, roughness: 1 });
      function addFootprint(wheel, contactDistance) {
        const mark = new THREE.Mesh(footprintGeometry, footprintMaterial);
        mark.position.set((contactDistance - state.distance) * UNIT_DISTANCE, -0.012, wheel.lane);
        mark.scale.setScalar(0.4);
        mark.userData = { contactDistance, wheel };
        mark.receiveShadow = true;
        scene.add(mark);
        wheel.footprints.push(mark);
        footprints.push(mark);
        if (footprints.length > MAX_FOOTPRINTS * wheels.length) {
          const oldest = footprints.shift();
          scene.remove(oldest);
          oldest.userData.wheel.footprints = oldest.userData.wheel.footprints.filter((item) => item !== oldest);
        }
      }

      function removeFilteredFootprints() {
        repeatedWheel.footprints = repeatedWheel.footprints.filter((mark) => {
          const value = START_VALUE + mark.userData.contactDistance;
          if (value % HEAD !== 0 || value === HEAD) return true;
          scene.remove(mark);
          const index = footprints.indexOf(mark);
          if (index >= 0) footprints.splice(index, 1);
          return false;
        });
      }

      function setStage(stage) {
        state.stage = Math.max(0, Math.min(STEPS.length - 1, stage));
        if (state.stage === 0 || state.stage === 1) {
          state.traceProgress = 0;
          state.traceRevealProgress = 0;
          state.bendProgress = 0;
          if (state.stage === 1) {
            state.alignmentProgress = 0;
            state.alignmentStart = firstWheel.rolling.rotation.z;
            state.alignedAngle = Math.round(state.alignmentStart / TAU) * TAU;
            state.distance = 0;
            footprints.forEach((mark) => scene.remove(mark));
            footprints.length = 0;
            wheels.forEach((wheel) => {
              wheel.footprints.length = 0;
              wheel.lastChecked = -1;
              wheel.impact = 0;
            });
          }
        } else {
          state.traceProgress = 1;
          state.traceRevealProgress = 1;
          state.bendProgress = state.stage === 4 ? 1 : 0;
        }
        state.filterIntroProgress = state.stage === 2 ? 0 : 1;
        state.filterProgress = state.stage < 2 ? 0 : state.stage === 2 ? 0 : 1;
        const visibleWheels = [
          [firstWheel],
          [firstWheel],
          [firstWheel],
          [firstWheel, repeatedWheel],
          [repeatedWheel],
        ][state.stage];
        wheels.forEach((wheel) => {
          const visible = visibleWheels.includes(wheel);
          wheel.carrier.visible = visible;
          wheel.glow.visible = visible;
          wheel.footprints.forEach((mark) => { mark.visible = visible; });
        });
        rulerLanes.forEach(({ lane, ruler }) => {
          ruler.visible = wheels.some((wheel) => visibleWheels.includes(wheel) && wheel.rulerLane === lane)
            && (state.stage !== 3 || lane === RULER_LANES.repeated);
        });
        repeatedWheel.pins.forEach((pin) => {
          pin.visible = false;
          pin.scale.y = 1;
        });
        repeatedWheel.candidatePins.filter((pin) => !pin.userData.filterHit).forEach((pin) => {
          pin.material.color.setHex(state.stage >= 3 ? COLORS.next : COLORS.wheel);
        });
        if (state.stage === 3) removeFilteredFootprints();
        title.textContent = STEPS[state.stage].title;
        description.textContent = STEPS[state.stage].description;
        stepCount.textContent = `${state.stage + 1} / ${STEPS.length}`;
        previousButton.disabled = state.stage === 0;
        updateControls();
      }

      function updateControls() {
        nextButton.disabled = state.stage === STEPS.length - 1
          || (state.stage === 1 && (state.traceProgress < 1 || state.traceRevealProgress < 1))
          || (state.stage === 2 && (state.filterIntroProgress < 1 || state.filterProgress < 1))
          || (state.stage === 3 && state.bendProgress < 1);
      }

      previousButton.addEventListener("click", () => setStage(state.stage - 1));
      nextButton.addEventListener("click", () => setStage(state.stage + 1));
      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" && !nextButton.disabled) setStage(state.stage + 1);
        if (event.key === "ArrowLeft") setStage(state.stage - 1);
      });

      function updateRuler() {
        const center = Math.floor(state.distance) + START_VALUE;
        const middle = Math.floor(markerPool.length / 2);
        const labelStride = viewHeight > 14 ? 5 : (viewHeight > 10 ? 2 : 1);
        const visibleRulerLanes = new Set(rulerLanes.filter(({ ruler }) => ruler.visible).map(({ lane }) => lane));
        markerPool.forEach((marker, index) => {
          const value = center + index - middle;
          marker.position.set((value - START_VALUE - state.distance) * UNIT_DISTANCE, 0, 0);
          marker.visible = value >= START_VALUE;
          if (!marker.visible) return;
          if (marker.userData.value !== value) {
            marker.userData.labels.forEach((label) => {
              label.material.map.dispose();
              label.material.map = makeLabelTexture(value);
              label.material.needsUpdate = true;
            });
            marker.userData.value = value;
          }
          marker.userData.ticks.forEach(({ rulerLane, mesh, guide }) => {
            const wheel = wheels.find((candidate) => candidate.rulerLane === rulerLane
              && candidate.carrier.visible && visibleRulerLanes.has(rulerLane));
            const localPosition = value - (wheel?.startValue ?? value);
            const reached = value <= START_VALUE + Math.floor(state.distance + 0.0001);
            const hit = wheel && reached && isActive(wheel, localPosition);
            mesh.visible = Boolean(wheel);
            guide.visible = Boolean(wheel);
            mesh.material.color.setHex(hit ? wheel.color : 0x353b37);
          });
          marker.userData.labels.forEach((label, index) => {
            label.visible = Boolean(marker.userData.ticks[index]?.mesh.visible
              && marker.visible && (value === START_VALUE || value % labelStride === 0));
          });
        });
      }

      function registerContacts() {
        const currentContact = Math.floor(state.distance + 0.0001);
        wheels.forEach((wheel) => {
          if (wheel.lastChecked >= currentContact) return;
          for (let contact = wheel.lastChecked + 1; contact <= currentContact; contact += 1) {
            const localPosition = contact - wheel.startPosition;
            if (localPosition >= 0 && isActive(wheel, localPosition)) {
              addFootprint(wheel, contact);
              wheel.impact = 1;
            }
          }
          wheel.lastChecked = currentContact;
        });
      }

      function updateScene(delta) {
        if (state.stage === 1 && state.alignmentProgress < 1) {
          state.alignmentProgress = Math.min(1, state.alignmentProgress + delta / 0.8);
        } else if (state.stage === 1) {
          state.traceProgress = Math.min(1, state.traceProgress + delta / TRACE_DURATION);
        }
        if (state.stage === 1 && state.traceProgress === 1) {
          state.traceRevealProgress = Math.min(1, state.traceRevealProgress + delta / 1.2);
        }
        if (state.stage === 2 && state.filterIntroProgress < 1) {
          state.filterIntroProgress = Math.min(1, state.filterIntroProgress + delta / 1.1);
        } else if (state.stage === 2) {
          state.filterProgress = Math.min(1, state.filterProgress + delta / FILTER_DURATION);
        }
        if (state.stage === 3) {
          state.bendProgress = Math.min(1, state.bendProgress + delta / 3.1);
        }
        const formed = state.stage >= 4 || (state.stage === 3 && state.bendProgress === 1);
        const fill = state.stage === 3 ? Math.max(0, (state.bendProgress - 0.78) / 0.22) : (state.stage >= 4 ? 1 : 0);
        repeatedWheel.body.scale.setScalar(fill);
        repeatedWheel.hub.scale.setScalar(fill);
        repeatedWheel.pins.forEach((pin) => {
          pin.visible = false;
        });
        repeatedWheel.candidatePins.filter((pin) => !pin.userData.filterHit).forEach((pin) => {
          pin.visible = formed;
        });
        repeatedWheel.glow.visible = repeatedWheel.carrier.visible && formed;
        updateConstruction();
        const sourceTravel = state.stage === 1 ? state.traceProgress * TRACE_LENGTH
          : state.stage === 2 || state.stage === 3 ? TRACE_LENGTH : 0;
        firstWheel.carrier.position.x = firstWheel.startPosition * UNIT_DISTANCE + sourceTravel;
        firstWheel.glow.position.x = firstWheel.carrier.position.x;
        wheels.forEach((wheel) => {
          if (wheel === firstWheel && state.stage >= 1 && state.stage <= 3) {
            const blend = state.alignmentProgress * state.alignmentProgress * (3 - 2 * state.alignmentProgress);
            wheel.rolling.rotation.z = THREE.MathUtils.lerp(state.alignmentStart, state.alignedAngle, blend) - sourceTravel / wheel.radius;
          } else {
            wheel.rolling.rotation.z = -(state.distance * UNIT_DISTANCE) / wheel.radius;
          }
          wheel.impact = Math.max(0, wheel.impact - delta * 4.8);
          const pulse = 1 + Math.sin((1 - wheel.impact) * Math.PI) * wheel.impact * 0.75;
          wheel.glow.scale.setScalar(pulse);
          wheel.glow.material.opacity = 0.18 + wheel.impact * 0.62;
        });
        const contactStep = Math.floor(sourceTravel / UNIT_DISTANCE);
        const contactFraction = sourceTravel / UNIT_DISTANCE - contactStep;
        const pinContact = isCandidatePosition(contactStep) && contactFraction < 0.85;
        contactLink.visible = state.stage === 1 && state.alignmentProgress === 1
          && state.traceProgress > 0 && state.traceProgress < 1;
        if (contactLink.visible) {
          contactLink.position.x = sourceTravel;
          contactLink.material.opacity = pinContact ? 0.35 + 0.55 * (1 - contactFraction / 0.85) : 0.35;
        }
        sandTexture.offset.x = -((state.distance * 0.055) % 1);
        footprints.forEach((mark) => {
          mark.position.x = (mark.userData.contactDistance - state.distance) * UNIT_DISTANCE;
          mark.visible = mark.userData.wheel.carrier.visible
            && (mark.userData.wheel !== repeatedWheel || formed)
            && mark.position.x > -14 && mark.position.x < 8;
        });
        updateRuler();
        updateControls();
        updateCamera(delta);
      }

      function updateCamera(delta) {
        const bend = state.stage === 3 ? state.bendProgress : 0;
        const narrow = camera.aspect < 0.75;
        const traceWindow = narrow ? 7.5 : 9.5;
        const reveal = state.stage === 1 && !narrow ? state.traceRevealProgress : 0;
        const filterRank = Math.min(badPinPositions.length - 1, Math.floor(state.filterProgress * badPinPositions.length));
        const baseHeight = state.stage === 0 ? 5.5 : 10.5;
        const requiredWidth = state.stage === 0 ? (narrow ? 3.6 : 9.5)
          : state.stage === 1 ? traceWindow + (TRACE_LENGTH + 3 - traceWindow) * reveal
          : state.stage === 2 ? (narrow ? traceWindow : TRACE_LENGTH + 3)
          : state.stage === 3 ? (narrow ? 9.5 : 9.5 + (TRACE_LENGTH + 3 - 9.5) * (1 - bend))
          : 9.5;
        const targetHeight = Math.max(baseHeight, requiredWidth / camera.aspect);
        const targetX = state.stage === 1 ? (narrow
          ? Math.max(0, state.traceProgress * TRACE_LENGTH - traceWindow / 2 + BASE_RADIUS + 1.2)
          : THREE.MathUtils.lerp(Math.max(0, state.traceProgress * TRACE_LENGTH - traceWindow / 2), TRACE_LENGTH / 2, reveal))
          : state.stage === 2 ? (narrow ? badPinPositions[filterRank] * UNIT_DISTANCE : TRACE_LENGTH / 2)
          : state.stage === 3 ? (narrow
            ? (TRACE_LENGTH - traceWindow / 2 + BASE_RADIUS + 1.2) * (1 - bend) ** 2
            : TRACE_LENGTH / 2 * (1 - bend) ** 2)
          : 0;
        const targetY = state.stage <= 2 ? 0.8
          : state.stage === 3 ? 0.8 + 2.7 * bend
          : 3.5;
        const blend = delta === 0 ? 1 : 1 - Math.exp(-4 * delta);
        state.cameraX += (targetX - state.cameraX) * blend;
        state.cameraY += (targetY - state.cameraY) * blend;
        state.cameraHeight += (targetHeight - state.cameraHeight) * blend;
        viewHeight = state.cameraHeight;
        camera.position.set(state.cameraX, state.cameraY + viewHeight * 0.8, viewHeight * 1.6);
        camera.lookAt(state.cameraX, state.cameraY, 0);
        camera.left = -viewHeight * camera.aspect / 2;
        camera.right = viewHeight * camera.aspect / 2;
        camera.top = viewHeight / 2;
        camera.bottom = -viewHeight / 2;
        camera.updateProjectionMatrix();
      }

      function resize() {
        renderer.setSize(shell.clientWidth, shell.clientHeight, false);
        camera.aspect = shell.clientWidth / shell.clientHeight;
        updateCamera(0);
      }
      new ResizeObserver(resize).observe(shell);
      resize();
      setStage(0);

      function animate(time) {
        const delta = state.previousTime ? Math.min((time - state.previousTime) / 1000, 0.05) : 0;
        state.previousTime = time;
        if (state.stage === 0 || state.stage >= 4) state.distance += SPEED * delta;
        registerContacts();
        updateScene(delta);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    </script>
  </body>
</html>

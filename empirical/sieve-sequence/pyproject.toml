[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-sequence-empirical"
version = "0.1.0"
description = "Fast empirical analysis for sieve-sequence candidate properties"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "sympy>=1.13",
]

[project.scripts]
sieve-sequence-window = "sieve_sequence_empirical.window_cli:main"
sieve-sequence-lineage = "sieve_sequence_empirical.lineage_cli:main"
sieve-sequence-four-lines = "sieve_sequence_empirical.four_lines_cli:main"
sieve-sequence-spacing = "sieve_sequence_empirical.spacing_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

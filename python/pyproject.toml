[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-sequence"
version = "0.1.0"
description = "Empirical analysis and visualization for sieve-sequence candidate properties"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "sympy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
]

[project.scripts]
sieve-sequence-window = "sieve_sequence.window_cli:main"
sieve-sequence-lineage = "sieve_sequence.lineage_cli:main"
sieve-sequence-four-lines = "sieve_sequence.four_lines_cli:main"
sieve-sequence-spacing = "sieve_sequence.spacing_cli:main"
sieve-sequence-phase-transition-window = "sieve_sequence.phase_transition_window_cli:main"
sieve-sequence-phase-transition-head = "sieve_sequence.phase_transition_head_cli:main"
sieve-sequence-hazard = "sieve_sequence.hazard_cli:main"
sieve-sequence-deferred3 = "sieve_sequence.deferred3_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]